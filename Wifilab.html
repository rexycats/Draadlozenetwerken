<style>
/* Layout: navy kopbalk in CVO Focus-stijl, segmentknop voor de 4 onderdelen, links een lijst (hoofdstukken/oefeningen), rechts het werkvlak. */

}

  --navy:#8FB0E8; --hdr:#141F36; --hdr-fg:#F2F5F8; --green:#4CC26A; --green-soft:#16341F;
  --line:#2E405A; --head:#22314D; --ok:#5BCB78; --ok-soft:#163420; --bad:#F08A63; --bad-soft:#3A1E15; --warn:#E8B04A; --warn-soft:#3A2C12;
  --focus:#4CC26A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1624; --surface:#172238; --sunk:#111A2C; --fg:#E5EBF2; --muted:#9FB0C2;

  --line:#2E405A; --head:#22314D; --ok:#5BCB78; --ok-soft:#163420; --bad:#F08A63; --bad-soft:#3A1E15; --warn:#E8B04A; --warn-soft:#3A2C12;
  --focus:#4CC26A; color-scheme:dark }

<script>
(()=>{
'use strict';
const NEED=2, TEACHER_CODE='2026', SECRET='focus-wifilab-6', KEY='wifilab-les6-v1', PER_EX=3;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nl=(n,d=0)=>Number(n).toLocaleString('nl-BE',{minimumFractionDigits:d,maximumFractionDigits:d});
const parseNum=s=>{s=String(s).trim().replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return s===''?NaN:Number(s)};
function hash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  let h2=h^0x5bd1e995;h2=Math.imul(h2^(h2>>>13),0x5bd1e995)>>>0;return ((h>>>0).toString(36).toUpperCase()+(h2>>>0).toString(36).toUpperCase()).replace(/[^A-Z0-9]/g,'').slice(0,8).padEnd(8,'X')}
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

/* ------------------------------------------------------------------ status */
let S={mode:'theory',ch:0,ex:0,prog:{},unlocked:false,attempts:0,test:null,lab:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur=null; // huidige oefenvraag {q, answered, hintShown, ...}

/* ------------------------------------------------------------------ helpers vraag */
function mc(q,correct,wrongs,expl,hint,extra){
  const opts=shuffle([correct,...wrongs.filter(w=>w!==correct)]);
  return Object.assign({type:'mc',q,opts,a:opts.indexOf(correct),expl,hint},extra||{});
}
function num(q,answer,tol,unit,expl,hint){return {type:'num',q,a:answer,tol,unit,expl,hint}}
const BANDS=['2,4 GHz','5 GHz','6 GHz'];

/* dBm */
const ZONES=[{min:-50,t:'Uitstekend'},{min:-67,t:'Goed'},{min:-75,t:'Matig'},{min:-85,t:'Slecht'},{min:-200,t:'Onbruikbaar'}];
const ZUSE={Uitstekend:'alles, maximale snelheid',Goed:'streaming, videobellen, gaming',Matig:'surfen en mail; videobellen kan haperen',Slecht:'de verbinding valt af en toe weg',Onbruikbaar:'niets: geen stabiele verbinding'};
const zoneOf=d=>ZONES.find(z=>d>=z.min).t;
function scaleHTML(dbm){
  const pct=dbm==null?null:Math.min(100,Math.max(0,(-30-dbm)/62*100));
  return `<div class="scale" aria-label="Schaal signaalsterkte"><div class="bar"><span class="z1"></span><span class="z2"></span><span class="z3"></span><span class="z4"></span><span class="z5"></span>${pct==null?'':`<i class="marker" style="left:${pct}%"></i>`}</div>
  <div class="zl"><span>uitstekend</span><span>goed</span><span>matig</span><span>slecht</span><span>onbr.</span></div>
  <div class="ticks"><span>-30</span><span>-50</span><span>-67</span><span>-75</span><span>-85</span><span>-92 dBm</span></div></div>`;
}

/* kanaalanalyse 2,4 GHz: overlap als kanalen minder dan 5 uit elkaar liggen */
function chanLoad(nets,k){let s=0;const hits=[];for(const n of nets){const d=Math.abs(n.ch-k);if(d<5){const w=Math.pow(10,n.dbm/10)*(1-d/5)*(n.w===40?1.5:1);s+=w;hits.push(n)}}return {s,hits}}
function chanSVG(nets,own){
  const W=640,H=230,x=c=>40+(c-1)*(W-80)/12;const placed=[];
  let g=`<svg class="chan" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kanalen op 2,4 GHz">`;
  for(let c=1;c<=13;c++){g+=`<text x="${x(c)}" y="${H-6}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${c}</text>`}
  g+=`<line x1="20" y1="${H-22}" x2="${W-20}" y2="${H-22}" style="stroke:var(--line)" stroke-width="1.5"/>`;
  nets.forEach((n,i)=>{const half=(n.w===40?4:2)*(W-80)/12, h=Math.max(14,(n.dbm+95)*2.1), cx=x(n.ch), y0=H-22;
    const own_=own&&n.own; const col=own_?'var(--green)':'var(--navy)';
    g+=`<path d="M${cx-half-14} ${y0} Q${cx-half} ${y0-h} ${cx} ${y0-h} Q${cx+half} ${y0-h} ${cx+half+14} ${y0}" style="fill:${own_?'var(--green)':'var(--navy)'};stroke:${col}" fill-opacity="${own_?.25:.10}" stroke-width="${own_?2.5:1.5}"/>`;
    let ly=y0-h-6;while(placed.some(p=>Math.abs(p.x-cx)<70&&Math.abs(p.y-ly)<13))ly-=13;placed.push({x:cx,y:ly});g+=`<text x="${cx}" y="${Math.max(12,ly)}" text-anchor="middle" font-size="11" style="fill:var(--fg)">${esc(n.ssid.length>14?n.ssid.slice(0,13)+'…':n.ssid)}</text>`});
  return g+'</svg>';
}

/* ------------------------------------------------------------------ data */
const STD=[
 {ieee:'802.11b',naam:null,jaar:1999,band:'2,4 GHz',max:'11 Mbit/s'},
 {ieee:'802.11g',naam:null,jaar:2003,band:'2,4 GHz',max:'54 Mbit/s'},
 {ieee:'802.11n',naam:'Wi-Fi 4',jaar:2009,band:'2,4 en 5 GHz',max:'600 Mbit/s'},
 {ieee:'802.11ac',naam:'Wi-Fi 5',jaar:2013,band:'5 GHz',max:'6,9 Gbit/s'},
 {ieee:'802.11ax',naam:'Wi-Fi 6',jaar:2019,band:'2,4 en 5 GHz',max:'9,6 Gbit/s'},
 {ieee:'802.11be',naam:'Wi-Fi 7',jaar:2024,band:'2,4, 5 en 6 GHz',max:'46 Gbit/s'}];
const LBL=s=>s.ieee+(s.naam?` (${s.naam})`:'');
const FEAT=[['MIMO: meerdere antennes, meerdere datastromen tegelijk','802.11n'],['OFDMA: één kanaal opdelen voor meerdere toestellen tegelijk','802.11ax'],
 ['Multi-Link Operation (MLO): meerdere banden tegelijk gebruiken','802.11be'],['kanalen van 160 MHz en MU-MIMO in de downlink','802.11ac'],
 ['kanalen van 320 MHz en 4096-QAM','802.11be'],['54 Mbit/s op de 2,4 GHz-band (OFDM)','802.11g'],['Target Wake Time (TWT) om batterij te sparen','802.11ax']];

const RATE={20:143.4,40:286.8,80:600.4,160:1201}; // Wi-Fi 6, per stream, Mbit/s
const ROUTERS=[[2,2,80,'AX1800'],[2,2,160,'AX3000'],[2,4,80,'AX3000'],[2,4,160,'AX5400'],[4,4,160,'AX6000']];

const DEV=[['laptop van mama','Hoofdnetwerk','een eigen toestel dat de NAS en printer moet kunnen bereiken'],['NAS met familiefoto’s','Hoofdnetwerk','bevat je eigen bestanden en moet afgeschermd blijven'],
 ['printer van het gezin','Hoofdnetwerk','de eigen laptops moeten erop kunnen afdrukken'],['gaming-pc van de zoon','Hoofdnetwerk','een eigen, goed beveiligd toestel'],
 ['smartphone van een bezoeker','Gastnetwerk','een toestel van iemand anders: alleen internet, geen toegang tot je eigen toestellen'],['laptop van een vriend van de zoon','Gastnetwerk','een vreemd toestel kan besmet zijn'],
 ['tablet van de loodgieter','Gastnetwerk','een vreemd toestel dat alleen internet nodig heeft'],['slimme stekker','IoT-netwerk','IoT-toestellen krijgen zelden updates; apart zetten beperkt de schade bij een lek'],
 ['deurbelcamera','IoT-netwerk','een IoT-toestel met vaak zwakke beveiliging'],['slimme thermostaat','IoT-netwerk','een IoT-toestel dat alleen met zijn cloud praat'],
 ['robotstofzuiger','IoT-netwerk','een IoT-toestel; heeft geen toegang tot je pc’s nodig'],['smart-tv','IoT-netwerk','de tv heeft alleen internet nodig en krijgt weinig updates']];
const NETS=['Hoofdnetwerk','IoT-netwerk','Gastnetwerk'];

const DEVICES=['Access point met kabel','Mesh-systeem','Repeater','Powerline-adapter met wifi','Straalverbinding (point-to-point)','Niets extra nodig'];
const SCEN=[
 ['Een appartement van 60 m² op één verdieping. De router staat centraal; overal meet je -50 tot -60 dBm.','Niets extra nodig','Het signaal is overal goed (beter dan -67 dBm). Extra toestellen kosten geld en kunnen zelf storing geven.'],
 ['Een rijwoning met drie verdiepingen. De familie wil overal één netwerknaam en zonder onderbreking van kamer naar kamer lopen. Kabels trekken kan niet.','Mesh-systeem','Een mesh-systeem maakt één netwerk met één naam; toestellen schakelen automatisch over naar de dichtste node.'],

const EX=[
{id:'std',title:'Wifi-standaarden',learn:`<p>De IEEE legt de standaarden vast (802.11…), de Wi-Fi Alliance geeft ze een eenvoudige naam.</p>
<div class="tbl"><table><tr><th>IEEE</th><th>Naam</th><th>Jaar</th><th>Band(en)</th><th>Max.</th><th>Nieuw</th></tr>
<tr><td>802.11b</td><td>—</td><td>1999</td><td>2,4 GHz</td><td>11 Mbit/s</td><td>eerste populaire wifi</td></tr>
<tr><td>802.11g</td><td>—</td><td>2003</td><td>2,4 GHz</td><td>54 Mbit/s</td><td>OFDM op 2,4 GHz</td></tr>
<tr><td>802.11n</td><td>Wi-Fi 4</td><td>2009</td><td>2,4 + 5 GHz</td><td>600 Mbit/s</td><td>MIMO, 40 MHz</td></tr>
<tr><td>802.11ac</td><td>Wi-Fi 5</td><td>2013</td><td>5 GHz</td><td>6,9 Gbit/s</td><td>80/160 MHz, MU-MIMO</td></tr>
<tr><td>802.11ax</td><td>Wi-Fi 6 / 6E</td><td>2019/20</td><td>2,4 + 5 (+ 6) GHz</td><td>9,6 Gbit/s</td><td>OFDMA, TWT; 6E: 6 GHz</td></tr>
<tr><td>802.11be</td><td>Wi-Fi 7</td><td>2024</td><td>2,4 + 5 + 6 GHz</td><td>46 Gbit/s</td><td>320 MHz, MLO</td></tr></table></div>`,
 gen(){const t=rnd(1,5);
  if(t===1){const s=pick(STD.filter(x=>x.naam));return mc(`Welke IEEE-standaard heet <b>${s.naam}</b>?`,s.ieee,shuffle(STD.map(x=>x.ieee).filter(i=>i!==s.ieee)).slice(0,3),`${s.naam} = ${s.ieee} (${s.jaar}).`,'Wi-Fi 4 is de oudste naam; elke volgende standaard telt er één bij.')}
  if(t===2){const s=pick(STD.filter(x=>x.naam));return mc(`Welke naam gaf de Wi-Fi Alliance aan <b>${s.ieee}</b>?`,s.naam,['Wi-Fi 4','Wi-Fi 5','Wi-Fi 6','Wi-Fi 7'].filter(n=>n!==s.naam),`${s.ieee} = ${s.naam}.`,'802.11n = Wi-Fi 4, daarna in volgorde: ac, ax, be.')}
  if(t===3){const [f,ie]=pick(FEAT);const s=STD.find(x=>x.ieee===ie);return mc(`Welke standaard bracht <b>${f}</b>?`,LBL(s),shuffle(STD.filter(x=>x.ieee!==ie).map(LBL)).slice(0,3),`${f}: ${LBL(s)}.`,'Denk aan de volgorde: MIMO (n) → MU-MIMO (ac) → OFDMA (ax) → MLO (be).')}
  if(t===4){const s=pick(STD);return mc(`Wat is de theoretische maximumsnelheid van <b>${LBL(s)}</b>?`,s.max,shuffle(STD.filter(x=>x!==s).map(x=>x.max)).slice(0,3),`${LBL(s)}: ${s.max}. In de praktijk haal je veel minder.`,'De snelheid stijgt telkens fors: 11 → 54 → 600 Mbit/s → Gbit/s.')}
  const s=pick(STD.filter(x=>x.ieee!=='802.11n'&&x.ieee!=='802.11ax'));return mc(`Welke band(en) gebruikt <b>${LBL(s)}</b>?`,s.band,['2,4 GHz','5 GHz','2,4 en 5 GHz','2,4, 5 en 6 GHz'].filter(b=>b!==s.band),`${LBL(s)}: ${s.band}.`,'b en g zijn oud (alleen 2,4 GHz); ac is alleen 5 GHz; Wi-Fi 7 gebruikt alle drie.')}},
{id:'band',title:'Banden en kanalen',learn:`<div class="tbl"><table><tr><th></th><th>2,4 GHz</th><th>5 GHz</th><th>6 GHz</th></tr>
<tr><td>Bereik</td><td>grootst</td><td>middel</td><td>kortst</td></tr><tr><td>Snelheid</td><td>laagst</td><td>hoog</td><td>hoogst</td></tr>
<tr><td>Storing</td><td>veel (buren, microgolf, Bluetooth)</td><td>minder (radar: DFS)</td><td>weinig</td></tr>
<tr><td>Kanalen</td><td>13, niet-overlappend: 1, 6, 11</td><td>± 19 (EU)</td><td>24 (EU)</td></tr></table></div>
<p>Op 2,4 GHz: kanaal 1, 6 of 11 met 20 MHz breedte. Breder kanaal = sneller, maar meer overlap.</p>`,
 gen(){if(Math.random()<.55){const [q,a,e]=pick(BANDQ);return mc(q.endsWith('?')?q:q+' <b>Welke band kies je?</b>',a,BANDS.filter(b=>b!==a),e,'Lagere frequentie = verder; hogere frequentie = sneller maar korter bereik.')}
  const [q,a,w,e]=pick(BANDFACT);return mc(q,a,w,e,'Op 2,4 GHz liggen de kanalen maar 5 MHz uit elkaar, terwijl een kanaal ± 20 MHz breed is.')}},
{id:'dbm',title:'Signaalsterkte (dBm)',learn:`<p>Signaalsterkte meet je in <b>dBm</b>: een negatief getal. Hoe dichter bij 0, hoe sterker. Elke <b>3 dB</b> minder = de <b>helft</b> van het vermogen, 10 dB minder = 10 keer zwakker.</p>${scaleHTML(null)}`,
 gen(){const t=rnd(1,3);
  if(t===1){let d;do{d=-rnd(36,92)}while([-50,-67,-75,-85].includes(d));const z=zoneOf(d);
    return mc(`Een laptop meet een signaal van <b>${d} dBm</b>. Hoe beoordeel je dat?`,z,ZONES.map(x=>x.t).filter(x=>x!==z).slice(0,4),`${d} dBm is <b>${z.toLowerCase()}</b>: geschikt voor ${ZUSE[z]}.${scaleHTML(d)}`,'Grenzen: -50 / -67 / -75 / -85 dBm.')}
  if(t===2){const diff=pick([3,6,9,10,20]),f={3:2,6:4,9:8,10:10,20:100}[diff],a=-rnd(40,60),b=a-diff;
    return num(`Toestel A meet <b>${a} dBm</b>, toestel B meet <b>${b} dBm</b>. Hoeveel keer sterker is het signaal bij A?`,f,0,'keer',`Het verschil is ${diff} dB. ${({3:'3 dB = 2 keer.',6:'Elke 3 dB is ×2: 2 × 2 = 4 keer.',9:'Elke 3 dB is ×2: 2 × 2 × 2 = 8 keer.',10:'10 dB = 10 keer.',20:'10 dB = ×10, dus 20 dB = 10 × 10 = 100 keer.'})[diff]}`,'3 dB = 2 keer, 10 dB = 10 keer.')}
  const vals=shuffle([-rnd(38,48),-rnd(55,64),-rnd(70,78),-rnd(82,90)]);const best=Math.max(...vals);
  return mc(`Welke meting is het <b>sterkste</b> signaal?`,best+' dBm',vals.filter(v=>v!==best).map(v=>v+' dBm'),`${best} dBm ligt het dichtst bij 0.`,'Negatieve getallen: -40 is groter dan -80.')}},
{id:'chan',title:'Kanaal kiezen (wifi-scan)',learn:`<p>Een wifi-scanner toont welke netwerken op welk kanaal zitten. Op 2,4 GHz overlappen kanalen die minder dan 5 uit elkaar liggen. Kies het kanaal (1, 6 of 11) met de <b>minste en zwakste</b> overlappende netwerken. Sterke buren (dicht bij 0 dBm) storen het meest.</p>`,
 gen(){for(let tries=0;tries<200;tries++){const n=rnd(4,7),nets=[];const names=shuffle(['telenet-4F2A1','Proximus-Home-77B3','Orange-Home-2C','WiFi-Buren','Galaxy-A54','DIRECT-HP-Print','VOO-8812','Wi-Free','Fam.Janssens','Scarlet-55A0']);
   for(let i=0;i<n;i++){const ch=Math.random()<.7?pick([1,6,11]):rnd(1,13);nets.push({ssid:names[i],ch,dbm:-rnd(45,88),w:Math.random()<.2?40:20})}
   const L=[1,6,11].map(k=>({k,...chanLoad(nets,k)})).sort((a,b)=>a.s-b.s);if(!(L[0].s<0.35*L[1].s||L[0].s===0&&L[1].s>0))continue;
   const rows=nets.map(x=>`<tr><td>${esc(x.ssid)}</td><td>${x.ch}</td><td>${x.w} MHz</td><td>${x.dbm} dBm</td></tr>`).join('');
   const ex=[1,6,11].map(k=>{const r=L.find(x=>x.k===k);return `kanaal ${k}: ${r.hits.length?r.hits.map(h=>`${esc(h.ssid)} (${h.dbm})`).join(', '):'geen overlap'}`}).join('<br>');
   return mc(`Resultaat van een wifi-scan (2,4 GHz). Op welk kanaal zet je je <b>eigen</b> netwerk?<div class="tbl"><table><tr><th>SSID</th><th>Kanaal</th><th>Breedte</th><th>Signaal</th></tr>${rows}</table></div>${chanSVG(nets)}`,
    'Kanaal '+L[0].k,['Kanaal 1','Kanaal 6','Kanaal 11'].filter(x=>x!=='Kanaal '+L[0].k),`Beste keuze: <b>kanaal ${L[0].k}</b> met 20 MHz. Overlappende netwerken:<br>${ex}`,'Tel per kanaal (1, 6, 11) de netwerken die minder dan 5 kanalen verschillen. Let vooral op sterke signalen.')}
  return mc('Welke kanalen overlappen niet op 2,4 GHz?','1, 6 en 11',['1, 2 en 3','5, 6 en 7'],'1, 6 en 11.','')}},
{id:'speed',title:'Marketingnamen en snelheid',learn:`<p>Een router als <b>AX3000</b>: AX = Wi-Fi 6 (AC = Wi-Fi 5, BE = Wi-Fi 7). Het getal = de <b>som</b> van de maximale snelheden van alle banden.</p>
<p>Wi-Fi 6, per stream: 20 MHz = 143 · 40 MHz = 287 · 80 MHz = 600 · 160 MHz = 1.201 Mbit/s. Snelheid van een band = streams × snelheid per stream.</p>
<p>Voorbeeld AX3000: 2,4 GHz 2 × 287 = 574 + 5 GHz 2 × 1.201 = 2.402 → ± 3.000.</p>`,
 gen(){const t=rnd(1,4);const [s24,s5,w5,name]=pick(ROUTERS);const b24=s24*RATE[40],b5=s5*RATE[w5];
  if(t===1)return num(`Een Wi-Fi 6-router heeft op 5 GHz <b>${s5} streams</b> en kanalen van <b>${w5} MHz</b>. Wat is de maximale snelheid van die band?`,Math.round(b5),Math.max(2,Math.round(b5*.01)),'Mbit/s',`${s5} × ${nl(RATE[w5],1)} = <b>${nl(b5)} Mbit/s</b>.`,`Per stream op ${w5} MHz: ${nl(RATE[w5],1)} Mbit/s.`);
  if(t===2)return mc(`Een Wi-Fi 6-router: 2,4 GHz met ${s24} streams (40 MHz), 5 GHz met ${s5} streams (${w5} MHz). Welke marketingnaam krijgt hij?`,name,['AX1800','AX3000','AX5400','AX6000','AX11000'].filter(n=>n!==name).slice(0,3),`${s24} × 287 + ${s5} × ${nl(RATE[w5])} = ${nl(b24)} + ${nl(b5)} ≈ ${nl(b24+b5)} → <b>${name}</b>.`,'Tel de snelheid van beide banden op.');
  if(t===3){const st=pick([1,2]),w=pick([80,160]);const v=Math.round(st*RATE[w]);return num(`Je smartphone heeft Wi-Fi 6 met <b>${st} stream${st>1?'s':''}</b>. De router gebruikt op 5 GHz kanalen van <b>${w} MHz</b>. Wat is de maximale linksnelheid van je smartphone?`,v,Math.max(2,Math.round(v*.01)),'Mbit/s',`Het toestel bepaalt het aantal streams: ${st} × ${nl(RATE[w],1)} = <b>${nl(v)} Mbit/s</b>. Dat de router meer streams heeft, helpt deze smartphone niet.`,'Kijk naar de streams van het toestel, niet van de router.')}
  const p=pick([['AX','Wi-Fi 6'],['AC','Wi-Fi 5'],['BE','Wi-Fi 7']]);return mc(`Een router heet <b>${p[0]}${pick(['1900','3000','5400','9300'])}</b>. Welke wifi-standaard is dat?`,p[1],['Wi-Fi 4','Wi-Fi 5','Wi-Fi 6','Wi-Fi 7'].filter(x=>x!==p[1]),`${p[0]} verwijst naar 802.11${p[0].toLowerCase()} = ${p[1]}.`,'De letters zijn het einde van de IEEE-naam: 802.11ac, ax, be.')}},
{id:'chain',title:'Zwakste schakel',learn:`<p>De snelheid naar internet is nooit hoger dan de <b>traagste schakel</b> in de keten: internetabonnement → WAN-poort van de router → wifi-linksnelheid van het toestel. In de praktijk haal je via wifi ongeveer 50 – 60 % van de linksnelheid.</p>`,
 gen(){for(;;){const sub=pick([150,300,500,1000,1500]),wan=pick([1000,1000,2500]),link=pick([287,574,867,1201,2402]);const items=[['het internetabonnement',sub],['de WAN-poort van de router',wan],['de wifi-linksnelheid van de laptop',link]];
   const m=Math.min(sub,wan,link);if(items.filter(x=>x[1]===m).length>1)continue;const w=items.find(x=>x[1]===m);
   const q=`Abonnement: <b>${nl(sub)} Mbit/s</b> · WAN-poort router: <b>${nl(wan)} Mbit/s</b> · wifi-linksnelheid laptop: <b>${nl(link)} Mbit/s</b>.`;
   if(Math.random()<.5)return num(q+' Wat is de maximale (theoretische) snelheid van de laptop naar internet?',m,0,'Mbit/s',`De traagste schakel is ${w[0]}: <b>${nl(m)} Mbit/s</b>. In de praktijk via wifi eerder ${nl(Math.round(Math.min(m,link*.6)))} Mbit/s of minder.`,'Neem het kleinste getal.');
   return mc(q+' Wat is de zwakste schakel?',w[0],items.map(x=>x[0]).filter(x=>x!==w[0]).concat(['de netwerkkabel van de decoder']),`${w[0][0].toUpperCase()+w[0].slice(1)} (${nl(m)} Mbit/s) is het traagst.`,'Zoek het kleinste getal.')}}},
{id:'sec',title:'Beveiliging',learn:`<p>Open en WEP: onveilig. WPA (TKIP): verouderd. <b>WPA2 (AES)</b>: minimum. <b>WPA3</b>: aanbevolen, verplicht op 6 GHz. Zet WPS uit, wijzig het standaard-beheerwachtwoord en update de firmware. Een verborgen SSID en MAC-filtering zijn geen echte beveiliging.</p>`,
 gen(){const [q,a,w,e]=pick(SEC);return mc(q,a,w,e,'Hoe nieuwer de beveiliging, hoe beter. ‘Verbergen’ is geen beveiligen.')}},
{id:'guest',title:'Gastnetwerk en IoT',learn:`<p>Een <b>gastnetwerk</b> geeft bezoekers internet, maar geen toegang tot je eigen toestellen. Zet ook <b>IoT-toestellen</b> (slimme stekkers, camera’s, tv) apart: ze krijgen zelden updates. Instellingen: eigen SSID en wachtwoord, geen LAN-toegang, client isolation, eventueel bandbreedtebeperking en tijdslimiet.</p>`,

  const [q,a,w,e]=pick(GUEST);return mc(q,a,w,e,'Een gastnetwerk scheidt toestellen die je niet vertrouwt van je eigen toestellen.')}},

<tr><td>Access point met kabel</td><td>beste resultaat als er een kabel kan liggen</td></tr><tr><td>Mesh-systeem</td><td>groot huis, één netwerknaam, naadloos roamen</td></tr>
<tr><td>Repeater</td><td>goedkoop, één dode hoek; halveert vaak de snelheid</td></tr><tr><td>Powerline</td><td>geen kabel mogelijk, zelfde elektrische installatie</td></tr>
<tr><td>Straalverbinding</td><td>tussen gebouwen met zichtlijn</td></tr></table></div>`,

const TH=[

<ul><li><b>Gedeeld medium</b>: alle toestellen op een kanaal delen de snelheid.</li><li><b>Half-duplex</b>: eerst luisteren, dan zenden (CSMA/CA).</li>
<li><b>Verzwakking</b> door afstand, muren, metaal en water.</li><li><b>Storing</b> door buren en andere toestellen.</li><li><b>Beveiliging</b>: het signaal stopt niet aan de voordeur.</li></ul>
<div class="tbl"><table><tr><th></th><th>UTP</th><th>Glasvezel</th><th>Wifi</th></tr><tr><td>Medium</td><td>elektrisch signaal</td><td>licht</td><td>radiogolven</td></tr>
<tr><td>Afstand</td><td>max. 100 m</td><td>kilometers</td><td>meters tot tientallen meters</td></tr><tr><td>Storing</td><td>weinig</td><td>geen</td><td>veel</td></tr><tr><td>Mobiel</td><td>nee</td><td>nee</td><td>ja</td></tr></table></div>
<p>Andere draadloze technologieën: Bluetooth (± 10 m), Zigbee/Thread (domotica), NFC (enkele cm), 4G/5G (km), straalverbinding (tussen gebouwen).</p>`],
['Banden en kanalen',EX[1].learn+`<p>Een <b>DFS-kanaal</b> (5 GHz, kanalen 52 – 140) moet uitwijken als er radar is: het netwerk valt dan even weg.</p>`],
['Signaalsterkte',EX[2].learn+`<p>Oorzaken van zwak signaal: afstand, beton, metaal (koelkast, radiator), spiegels en water, vloerverwarming, buren op hetzelfde kanaal, microgolfoven, een router in de meterkast of achter de tv.</p>`],
['Wifi-standaarden',EX[0].learn+`<p>Nieuwe standaarden zijn <b>achterwaarts compatibel</b>: een oud toestel verbindt wel, maar aan zijn eigen (lage) snelheid.</p>
<div class="tbl"><table><tr><th>Begrip</th><th>Betekenis</th></tr><tr><td>MIMO</td><td>meerdere antennes, meerdere datastromen (streams)</td></tr><tr><td>MU-MIMO</td><td>meerdere toestellen tegelijk bedienen</td></tr>
<tr><td>OFDMA</td><td>kanaal opdelen voor veel kleine toestellen</td></tr><tr><td>Beamforming</td><td>signaal richten naar het toestel</td></tr><tr><td>Band steering</td><td>toestellen naar 5 GHz sturen</td></tr><tr><td>MLO</td><td>meerdere banden tegelijk (Wi-Fi 7)</td></tr></table></div>`],
['Snelheid in de praktijk',EX[4].learn+EX[5].learn],
['Netwerkapparaten',EX[8].learn+`<p>Tip: de kabel blijft koning. Ook bij mesh is een bekabelde verbinding tussen de nodes (<b>wired backhaul</b>) het snelst.</p>`],
['Beveiliging en gastnetwerk',EX[6].learn+EX[7].learn+`<p>Niet verwarren: Telenet Wi-Free of Proximus Public Wi-Fi op je modem is een publiek netwerk van de provider, niet jouw gastnetwerk.</p>`]];

const app=$('#app');
const done=id=>(S.prog[id]||0)>=NEED;
const allDone=()=>EX.every(e=>done(e.id));
const testOpen=()=>S.unlocked||allDone();
const inTest=()=>S.test&&!S.test.done;

function setMode(m){if(inTest()&&m!=='test')return;S.mode=m;save();render()}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
$('#modes').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const ms=['theory','practice','lab','test'];let i=ms.indexOf(S.mode);i=(i+(e.key==='ArrowRight'?1:3))%4;setMode(ms[i]);$('#m-'+S.mode).focus()});

function renderModes(){
  document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.m===S.mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;b.disabled=inTest()&&b.dataset.m!=='test'});

function render(){renderModes();({theory:rTheory,practice:rPractice,lab:rLab,test:rTest})[S.mode]()}

function side(items,curI,onPick,chips){
  return `<div class="side" role="navigation">${items.map((t,i)=>`<button class="navi" data-i="${i}" aria-current="${i===curI}"><span class="lbl">${esc(t)}</span>${chips?chips(i):''}</button>`).join('')}</div>`;
}
function bindSide(fn){app.querySelectorAll('.navi').forEach(b=>b.addEventListener('click',()=>fn(+b.dataset.i)))}

function rTheory(){
  const [t,h]=TH[S.ch]||TH[0];
  app.innerHTML=`<div class="layout">${side(TH.map(x=>x[0]),S.ch)}<section class="panel"><div class="eyebrow">Theorie · ${S.ch+1} van ${TH.length}</div><h2>${t}</h2><div class="prose">${h}</div>
  <div class="actions">${S.ch>0?'<button class="btn ghost" id="prev">Vorige</button>':''}${S.ch<TH.length-1?'<button class="btn" id="next">Volgende</button>':'<button class="btn green" id="go">Naar Oefenen</button>'}</div></section></div>`;
  bindSide(i=>{S.ch=i;save();rTheory()});
  $('#prev')?.addEventListener('click',()=>{S.ch--;save();rTheory()});$('#next')?.addEventListener('click',()=>{S.ch++;save();rTheory()});$('#go')?.addEventListener('click',()=>setMode('practice'));
}

function chipFor(i){const id=EX[i].id,n=S.prog[id]||0;return `<span class="chip ${n>=NEED?'done':''}">${n>=NEED?'✓ ':''}${Math.min(n,NEED)}/${NEED}</span>`}

function rPractice(){
  const ex=EX[S.ex]||EX[0];
  if(!cur||cur.ex!==ex.id){cur={ex:ex.id,q:ex.gen(),answered:false,hint:false,sel:null}}
  const n=S.prog[ex.id]||0;
  app.innerHTML=`<div class="layout">${side(EX.map(e=>e.title),S.ex,null,chipFor)}<section class="panel">
   <div class="eyebrow">Oefening ${S.ex+1} van ${EX.length}</div><h2>${ex.title}</h2>
   <div class="prog"><div class="dots">${Array.from({length:NEED},(_,i)=>`<span class="dot ${i<n?'on':''}"></span>`).join('')}</div><span class="small muted">${n>=NEED?`Voltooid · ${n} keer juist`:`Beantwoord ${NEED} vragen juist (bij de eerste poging) om deze oefening te voltooien.`}</span></div>
   <details class="learn" ${n===0?'open':''}><summary>Uitleg</summary><div class="prose">${ex.learn}</div></details>
   <div id="qhost"></div></section></div>`;
  bindSide(i=>{S.ex=i;save();cur=null;rPractice()});
  drawQ($('#qhost'),cur,{practice:true,onDone:ok=>{if(ok){S.prog[ex.id]=(S.prog[ex.id]||0)+1;save();renderModes();app.querySelectorAll('.navi .chip').forEach((c,i)=>c.outerHTML=chipFor(i));
      const d=app.querySelectorAll('.dot');d.forEach((x,i)=>x.classList.toggle('on',i<S.prog[ex.id]))}},
    onNext:()=>{cur={ex:ex.id,q:ex.gen(),answered:false,hint:false,sel:null};rPractice()},
    onNextEx:()=>{const nx=EX.findIndex((e,i)=>i>S.ex&&!done(e.id));const j=nx>=0?nx:EX.findIndex(e=>!done(e.id));if(j<0){setMode('test');return}S.ex=j;save();cur=null;rPractice()}});
}

/* een vraag tekenen (oefenen en toets) */
function drawQ(host,st,o){
  const q=st.q;
  host.innerHTML=`<div class="qcard"><div class="qtext">${q.q}</div>
   ${q.type==='mc'?`<div class="opts" role="group" aria-label="Antwoorden">${q.opts.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join('')}</div>`
   :`<div class="numrow"><label for="numIn" class="small muted">Antwoord</label><input id="numIn" inputmode="decimal" autocomplete="off"><span>${esc(q.unit||'')}</span></div>`}
   <div class="actions">${o.practice?`<button class="btn" id="check">Controleer</button>${q.hint?'<button class="btn ghost" id="hintB">Hint</button>':''}`:`<button class="btn" id="check">${o.last?'Toets afronden':'Volgende vraag'}</button>`}</div>
   <div id="fbx"></div></div>`;
  let sel=null;
  host.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(st.answered)return;sel=+b.dataset.i;host.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))}));
  const inp=host.querySelector('#numIn');inp?.addEventListener('keydown',e=>{if(e.key==='Enter')host.querySelector('#check').click()});
  host.querySelector('#hintB')?.addEventListener('click',()=>{st.hint=true;host.querySelector('#fbx').innerHTML=`<div class="fb hint"><b class="t">Hint</b><div>${q.hint}</div></div>`});
  host.querySelector('#check').addEventListener('click',()=>{
    if(st.answered){return}
    let ok;
    if(q.type==='mc'){if(sel==null){flash('Kies eerst een antwoord.');return}ok=sel===q.a}
    else{const v=parseNum(inp.value);if(isNaN(v)){flash('Vul een getal in.');return}ok=Math.abs(v-q.a)<=q.tol}
    if(!o.practice){o.onAnswer(ok,q.type==='mc'?q.opts[sel]:inp.value);return}
    st.answered=true;
    if(q.type==='mc')host.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===sel)b.classList.add('wrong')});else inp.disabled=true;
    const counted=ok;
    host.querySelector('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b class="t">${ok?'Juist!':'Niet juist.'}</b>${q.type==='num'&&!ok?`<div>Het juiste antwoord is <b>${nl(q.a,q.a%1?1:0)} ${esc(q.unit||'')}</b>.</div>`:''}<div>${q.expl}</div></div>`;
    host.querySelector('.actions').innerHTML=`<button class="btn" id="nextQ">Nieuwe vraag</button>`;
    o.onDone(counted);
    const n=S.prog[st.ex]||0;if(n>=NEED){host.querySelector('.actions').insertAdjacentHTML('beforeend',`<button class="btn green" id="nextEx">${allDone()?'Naar de eindtoets':'Volgende oefening'}</button>`);host.querySelector('#nextEx').addEventListener('click',o.onNextEx)}
    host.querySelector('#nextQ').addEventListener('click',o.onNext);host.querySelector('#nextQ').focus();
  });
  function flash(m){host.querySelector('#fbx').innerHTML=`<div class="fb hint"><div>${m}</div></div>`}
}

    const nets=L.nets.filter(n=>n.ssid||n.ch||n.dbm).map(n=>({ssid:n.ssid||'(geen naam)',ch:parseInt(n.ch),dbm:parseInt(String(n.dbm).replace('+','')),w:20}));
    nets.forEach(n=>{if(!(n.ch>=1&&n.ch<=13))err.push(`Kanaal van ${n.ssid} ontbreekt of is fout (1 – 13).`);if(!(n.dbm<=-20&&n.dbm>=-100))err.push(`Signaal van ${n.ssid} moet tussen -20 en -100 dBm liggen (negatief getal).`)});
    if(nets.length<1)err.push('Vul minstens één ander netwerk in. Zie je er geen? Noteer dat bij je leerkracht.');
    const meas=L.meas.filter(m=>m.p||m.dbm||m.dl).map(m=>({p:m.p||'(plaats)',dbm:parseInt(m.dbm),dl:parseNum(m.dl)}));
    meas.forEach(m=>{if(!(m.dbm<=-20&&m.dbm>=-100))err.push(`Signaal in ${m.p} moet tussen -20 en -100 dBm liggen.`)});
    if(meas.length<3)err.push('Vul drie metingen in.');
    if(!L.name.trim()||!L.klas.trim())err.push('Vul je naam en klas in.');
    $('#labErr').innerHTML=err.length?`<div class="fb no"><b class="t">Nog niet volledig</b><div>${err.map(esc).join('<br>')}</div></div>`:'';
    if(err.length){$('#labOut').innerHTML='';return}
    const L3=[1,6,11].map(k=>({k,...chanLoad(nets,k)})).sort((a,b)=>a.s-b.s);const best=L3[0].k;
    const ownLoad=chanLoad(nets,own);const ownIsBest=[1,6,11].includes(own)&&(own===best||ownLoad.s<=L3[0].s*1.5);
    const adv=[];
    if(![1,6,11].includes(own))adv.push(`Je netwerk staat op kanaal ${own}: dat overlapt met twee ‘niet-overlappende’ kanalen. Kies 1, 6 of 11.`);
    if(L.own.w===40)adv.push('Je gebruikt 40 MHz op 2,4 GHz: dat neemt bijna de halve band in. Zet de breedte op 20 MHz.');
    adv.push(ownIsBest?`Kanaal ${own} is een goede keuze.`:`Zet je 2,4 GHz-netwerk op <b>kanaal ${best}</b>: daar is de minste overlap.`);
    const b5=parseInt(L.own.b5);if(b5>=52&&b5<=144)adv.push(`Op 5 GHz gebruik je kanaal ${b5}, een DFS-kanaal: het netwerk kan even wegvallen als er radar is. Wil je dat vermijden, kies dan 36 – 48.`);
    const weak=meas.filter(m=>m.dbm<-67);if(weak.length)adv.push(`Zwak signaal in: ${weak.map(m=>esc(m.p)).join(', ')}. Denk aan een betere plaats voor de router, een access point met kabel of een mesh-node.`);
    const rows=meas.map(m=>{const z=zoneOf(m.dbm);return `<tr><td>${esc(m.p)}</td><td>${m.dbm} dBm</td><td class="${z==='Uitstekend'||z==='Goed'?'ok-t':z==='Matig'?'warn-t':'bad-t'}">${z}</td><td>${isNaN(m.dl)?'—':nl(m.dl,m.dl%1?1:0)+' Mbit/s'}</td></tr>`}).join('');
    const code=hash(`${norm(L.name)}|${norm(L.klas)}|${best}|${own}|${meas.map(m=>m.dbm).join(',')}|${L.sample?1:0}|${SECRET}`);
    const viz=nets.concat([{ssid:(L.own.ssid||'Eigen netwerk')+' (jij)',ch:own,dbm:-45,w:L.own.w===40?40:20,own:true}]);
    $('#labOut').innerHTML=`<div class="report"><div class="eyebrow">Verslag praktijk · Wifilab</div>
     <div class="grid2"><div><div class="muted small">Naam</div><b>${esc(L.name)}</b></div><div><div class="muted small">Klas</div><b>${esc(L.klas)}</b></div><div><div class="muted small">Datum</div><b>${new Date().toLocaleString('nl-BE',{dateStyle:'short',timeStyle:'short'})}</b></div><div><div class="muted small">Verslagcode</div><span class="code">${code}</span></div></div>
     ${L.sample?'<div class="warn-t">Gemaakt met voorbeeldgegevens</div>':''}
     <h3>Kanalen op 2,4 GHz</h3>${chanSVG(viz,true)}
     <div class="tbl"><table><tr><th>Kanaal</th><th>Overlappende netwerken</th></tr>${[1,6,11].map(k=>{const r=L3.find(x=>x.k===k);return `<tr><td>${k}${k===best?' <span class="ok-t">beste</span>':''}</td><td>${r.hits.length?r.hits.map(h=>`${esc(h.ssid)} (${h.dbm} dBm)`).join(', '):'geen'}</td></tr>`}).join('')}</table></div>
     <h3>Metingen</h3><div class="tbl"><table><tr><th>Plaats</th><th>Signaal</th><th>Beoordeling</th><th>Download</th></tr>${rows}</table></div>
     <h3>Advies</h3><ul class="prose" style="padding-left:1.2em;margin:0">${adv.map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
    $('#labOut').scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* ------------------------------------------------------------------ eindtoets */
let blurBound=false;
function bindBlur(){if(blurBound)return;blurBound=true;const f=()=>{if(inTest()&&S.test.started){S.test.blur=(S.test.blur||0)+1;save()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)f()})}
function rTest(){
  if(!testOpen()){
    app.innerHTML=`<section class="panel"><div class="eyebrow">Eindtoets</div><h2>Eerst alle oefeningen voltooien</h2>
    <p class="muted">Beantwoord bij elke oefening minstens ${NEED} vragen juist in het onderdeel Oefenen. Dan gaat de eindtoets open.</p>
    <div class="lock">${EX.map((e,i)=>`<div class="lockrow"><span>${esc(e.title)}</span><span class="actions">${chipFor(i)}${done(e.id)?'':`<button class="btn ghost" data-go="${i}">Oefen</button>`}</span></div>`).join('')}</div></section>`;
    app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{S.ex=+b.dataset.go;cur=null;setMode('practice')}));return}
  const T=S.test;
  if(!T||T.done&&T.view==='intro'){
    const prev=T&&T.done?`<p class="small muted">Je vorige poging: ${T.score}/${T.qs.length}. Een nieuwe poging telt als poging ${S.attempts+1}.</p><div class="actions"><button class="btn ghost" id="showRep">Vorig rapport tonen</button></div>`:'';
    app.innerHTML=`<section class="panel"><div class="eyebrow">Eindtoets</div><h2>Klaar voor de eindtoets</h2>
    <div class="prose"><p>De eindtoets heeft <b>${EX.length*PER_EX} vragen</b>: ${PER_EX} per oefening. Elke vraag is 1 punt. Je krijgt geen hints en je kan niet terug naar een vorige vraag.</p>
    <p>Tijdens de toets zijn Theorie, Oefenen en Praktijk gesloten. Als je het venster verlaat, wordt dat genoteerd.</p><p>Aan het einde krijg je een rapport. <b>Neem daar een screenshot van</b> en lever het in bij je leerkracht.</p></div>
    ${prev}
    <div class="grid2"><div class="field"><label for="t-name">Naam</label><input id="t-name" value="${esc(S.lab?.name||'')}"></div><div class="field"><label for="t-klas">Klas / groep</label><input id="t-klas" value="${esc(S.lab?.klas||'')}"></div></div>
    <div class="actions"><button class="btn green" id="start">Start de eindtoets</button></div><div id="tErr"></div></section>`;
    $('#showRep')?.addEventListener('click',()=>{S.test.view='report';save();rTest()});
    $('#start').addEventListener('click',()=>{const name=$('#t-name').value.trim(),klas=$('#t-klas').value.trim();if(!name||!klas){$('#tErr').innerHTML='<div class="fb no"><div>Vul je naam en klas in.</div></div>';return}
      const qs=[];EX.forEach(e=>{const seen=new Set();for(let i=0;i<PER_EX;i++){const q=genUnique(e,seen);qs.push(Object.assign({ex:e.id},q))}});
      S.attempts=(S.attempts||0)+1;S.test={name,klas,qs,i:0,ans:[],start:Date.now(),blur:0,attempt:S.attempts,done:false,started:true};save();bindBlur();renderModes();rTest()});
    return}
  if(T.done){rReport();return}
  bindBlur();
  const q=T.qs[T.i];
  app.innerHTML=`<section class="panel"><div class="prog" style="justify-content:space-between"><div class="eyebrow">Eindtoets · vraag ${T.i+1} van ${T.qs.length}</div><span class="small muted">${esc(EX[EXI[q.ex]].title)}</span></div>
   <div style="height:6px;background:var(--sunk);border-radius:3px;overflow:hidden"><div style="height:100%;width:${T.i/T.qs.length*100}%;background:var(--green)"></div></div><div id="qhost"></div></section>`;
  drawQ($('#qhost'),{q,answered:false},{practice:false,last:T.i===T.qs.length-1,onAnswer:(ok,given)=>{T.ans.push({ok,given});T.i++;
    if(T.i>=T.qs.length){T.done=true;T.end=Date.now();T.score=T.ans.filter(a=>a.ok).length;T.view='report';T.code=reportCode(T)}save();renderModes();rTest();window.scrollTo({top:0})}});
}
function reportCode(T){return hash(`${norm(T.name)}|${norm(T.klas)}|${T.score}|${T.attempt}|${SECRET}`)}
function rReport(){
  const T=S.test,dur=Math.round((T.end-T.start)/1000),pct=Math.round(T.score/T.qs.length*100);
  const per=EX.map(e=>{const idx=T.qs.map((q,i)=>q.ex===e.id?i:-1).filter(i=>i>=0);return [e.title,idx.filter(i=>T.ans[i]?.ok).length,idx.length]});
  app.innerHTML=`<section class="panel"><div class="report"><div class="eyebrow">Rapport eindtoets · Wifilab · draadloze netwerken</div>
   <div class="grid2"><div><div class="muted small">Naam</div><b>${esc(T.name)}</b></div><div><div class="muted small">Klas</div><b>${esc(T.klas)}</b></div>
   <div><div class="muted small">Datum</div><b>${new Date(T.end).toLocaleString('nl-BE',{dateStyle:'short',timeStyle:'short'})}</b></div><div><div class="muted small">Controlecode</div><span class="code">${T.code}</span></div></div>
   <div class="prog"><span class="big">${T.score}/${T.qs.length}</span><span class="${pct>=50?'ok-t':'bad-t'}">${pct} %</span></div>
   <div class="tbl"><table><tr><th>Onderdeel</th><th>Score</th></tr>${per.map(p=>`<tr><td>${esc(p[0])}</td><td>${p[1]}/${p[2]}</td></tr>`).join('')}</table></div>
   <div class="grid2 small"><div>Duur: <b>${Math.floor(dur/60)} min ${dur%60} s</b></div><div>Poging: <b>${T.attempt}</b></div><div>Venster verlaten: <b>${T.blur||0} keer</b></div>${S.unlocked&&!allDone()?'<div class="warn-t">Toets ontgrendeld door leerkracht</div>':''}</div></div>
   <p class="muted">Neem een screenshot van dit rapport en lever het in.</p>
   <details class="learn"><summary>Mijn antwoorden bekijken</summary><div class="prose">${T.qs.map((q,i)=>`<div style="border-bottom:1px solid var(--line);padding-block:8px"><div class="small muted">Vraag ${i+1} · ${T.ans[i]?.ok?'<span class="ok-t">juist</span>':'<span class="bad-t">fout</span>'}</div><div>${q.q.replace(/<div class="tbl">[\s\S]*?<\/div>|<svg[\s\S]*?<\/svg>/g,' [tabel] ')}</div><div class="small">Jouw antwoord: ${esc(T.ans[i]?.given??'')} · Juist: <b>${q.type==='mc'?esc(q.opts[q.a]):nl(q.a,q.a%1?1:0)+' '+esc(q.unit||'')}</b></div></div>`).join('')}</div></details>
   <div class="actions"><button class="btn ghost" id="again">Nieuwe poging</button><button class="btn" id="toPractice">Verder oefenen</button></div></section>`;
  $('#again').addEventListener('click',()=>{S.test.view='intro';save();rTest()});
  $('#toPractice').addEventListener('click',()=>setMode('practice'));
}

/* ------------------------------------------------------------------ leerkracht */
$('#teacherBtn').addEventListener('click',()=>teacher(false));
function teacher(authed){
  const M=$('#modal');
  if(!authed){M.innerHTML=`<div class="overlay" id="ov"><form class="dialog" id="tf"><h2>Leerkracht</h2><div class="field"><label for="tcode">Leerkrachtcode</label><input id="tcode" type="password" inputmode="numeric" autocomplete="off"></div><div id="terr"></div><div class="actions"><button class="btn" type="submit">Openen</button><button class="btn ghost" type="button" id="tclose">Sluiten</button></div></form></div>`;
    $('#tcode').focus();$('#tclose').addEventListener('click',()=>M.innerHTML='');
    $('#tf').addEventListener('submit',e=>{e.preventDefault();if($('#tcode').value.trim()===TEACHER_CODE)teacher(true);else $('#terr').innerHTML='<div class="fb no"><div>Deze code klopt niet.</div></div>'});return}
  M.innerHTML=`<div class="overlay"><div class="dialog"><h2>Leerkracht</h2>
   <h3>Eindtoets</h3><p class="small muted">Status: ${allDone()?'alle oefeningen voltooid':EX.filter(e=>done(e.id)).length+'/'+EX.length+' oefeningen voltooid'} · ${S.unlocked?'ontgrendeld door leerkracht':'niet manueel ontgrendeld'}</p>
   <div class="actions"><button class="btn" id="unl">${S.unlocked?'Ontgrendeling intrekken':'Toets ontgrendelen op dit toestel'}</button></div>
   <h3>Rapportcode controleren</h3>
   <form id="vf" class="grid2"><div class="field"><label for="v-n">Naam</label><input id="v-n"></div><div class="field"><label for="v-k">Klas</label><input id="v-k"></div>
   <div class="field"><label for="v-s">Score</label><input id="v-s" inputmode="numeric"></div><div class="field"><label for="v-p">Poging</label><input id="v-p" inputmode="numeric"></div>
   <div class="field"><label for="v-c">Controlecode</label><input id="v-c" autocomplete="off"></div><div class="field" style="justify-content:flex-end"><button class="btn" type="submit">Controleer</button></div></form><div id="vres"></div>
   <h3>Voortgang wissen</h3><p class="small muted">Wist oefeningen, praktijk en toetsen op dit toestel.</p><div class="actions" id="wipeA"><button class="btn danger" id="wipe">Alles wissen</button></div>
   <div class="actions"><button class="btn ghost" id="tclose">Sluiten</button></div></div></div>`;
  $('#tclose').addEventListener('click',()=>M.innerHTML='');
  $('#unl').addEventListener('click',()=>{S.unlocked=!S.unlocked;save();render();teacher(true)});
  $('#vf').addEventListener('submit',e=>{e.preventDefault();const c=hash(`${norm($('#v-n').value)}|${norm($('#v-k').value)}|${parseInt($('#v-s').value)}|${parseInt($('#v-p').value)}|${SECRET}`);
    const ok=c===$('#v-c').value.trim().toUpperCase();$('#vres').innerHTML=`<div class="fb ${ok?'ok':'no'}"><div>${ok?'De code klopt bij deze naam, klas, score en poging.':'De code klopt niet. Controleer naam en klas (exact zoals op het rapport), score en poging.'}</div></div>`});
  $('#wipe').addEventListener('click',()=>{$('#wipeA').innerHTML='<span class="bad-t">Zeker? Dit kan niet ongedaan worden.</span><button class="btn danger" id="wipe2">Ja, alles wissen</button><button class="btn ghost" id="wipeN">Annuleren</button>';
    $('#wipeN').addEventListener('click',()=>teacher(true));
    $('#wipe2').addEventListener('click',()=>{S={mode:'theory',ch:0,ex:0,prog:{},unlocked:false,attempts:0,test:null,lab:null};cur=null;save();M.innerHTML='';render()})});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)$('#modal').innerHTML=''});

if(inTest())S.mode='test';
render();
window.__wifilab={EX,chanLoad,hash,S:()=>S};
})();
</script>

</body></html>
